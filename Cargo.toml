[package]
name = "irr"
version = "0.1.0"
edition = "2024"

[dependencies]
env_logger = "0.11.8"
log = "0.4.29"
ndarray = { version = "0.17.1", features = ["rayon"] }
polars = "0.52.0"
rayon = "1.11.0"
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3
debug = false
strip = true 
